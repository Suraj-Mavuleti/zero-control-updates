  <script>
    // Pick the right installer for the visitor's system; the file is served
    // from this site, so the download starts without leaving the page.
    const DOWNLOADS = {
      windows: { label: "Download for Windows", href: "/zero-control/download/ZeroControl-Setup.exe", file: "ZeroControl-Setup.exe" },
      linux: { label: "Download for Linux", href: "/zero-control/download/zero-control-install.sh", file: "zero-control-install.sh" },
      android: { label: "Download for Android", href: "/zero-control/download/ZeroControl.apk", file: "ZeroControl.apk" },
    };
    const ua = navigator.userAgent;
    const OS = /Android/i.test(ua) ? "android" : /Windows/i.test(ua) ? "windows" : /Linux|X11/i.test(ua) ? "linux" : null;
    document.querySelectorAll("[data-download]").forEach(link => {
      const choice = DOWNLOADS[link.dataset.download || OS];
      if (!choice) return;
      link.href = choice.href;
      link.setAttribute("download", choice.file);
      const label = link.querySelector("[data-download-label]");
      if (label && !link.dataset.download) label.textContent = choice.label;
      link.addEventListener("click", () => {
        const os = link.dataset.download || OS;
        document.querySelectorAll(".steps").forEach(s => s.classList.toggle("show", s.dataset.os === os));
      });
    });
  </script>
  <script>
    (function () {
      const esc = text => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = text => esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      // Notes are plain text: "- " bullets (two spaces deeper for sub-points) and **bold**.
      function render(notes) {
        let out = "", depth = 0;
        notes.split("\n").forEach(line => {
          const bullet = line.match(/^(\s*)[-*]\s+(.*)$/);
          if (bullet) {
            const level = bullet[1].length >= 2 ? 2 : 1;
            while (depth < level) { out += "<ul>"; depth++; }
            while (depth > level) { out += "</ul>"; depth--; }
            out += "<li>" + inline(bullet[2]) + "</li>";
          } else if (line.trim()) {
            while (depth > 0) { out += "</ul>"; depth--; }
            out += "<p>" + inline(line.trim()) + "</p>";
          }
        });
        while (depth > 0) { out += "</ul>"; depth--; }
        return out;
      }
      const box = document.getElementById("releases");
      fetch("/zero-control/releases.json", { cache: "no-store" }).then(r => r.json()).then(releases => {
        box.innerHTML = releases.map((release, i) => {
          const date = new Date(release.date).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
          return '<section class="release"><h2>Version ' + esc(release.version) + (i === 0 ? ' <span class="badge">Latest</span>' : "") +
            '</h2><div class="date">' + date + "</div>" + render(release.notes) + "</section>";
        }).join("");
      }).catch(() => { box.innerHTML = "<p>Couldn't load the release notes. Check your connection and reload.</p>"; });
    })();
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof gsap !== "undefined") {
        gsap.from(".gs-reveal", { y: 40, opacity: 0, duration: 1.2, stagger: 0.08, ease: "power4.out", delay: 0.2 });
      }
      document.querySelectorAll("[data-scramble]").forEach(el => {
        const original = el.textContent;
        const chars = "!<>-_\\/[]{}—=+*^?#________";
        let iter = 0;
        const interval = setInterval(() => {
          el.textContent = original.split("").map((letter, i) => i < iter ? original[i] : chars[Math.floor(Math.random() * chars.length)]).join("");
          if (iter >= original.length) clearInterval(interval);
          iter += 1 / 3;
        }, 30);
      });
    });
  </script>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
